<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 — Page Not Found | Thom Simbeye</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', ui-sans-serif, system-ui; }
        .gradient-text {
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 50%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50%       { transform: translateY(-12px); }
        }
        .float { animation: float 4s ease-in-out infinite; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Nav -->
    <nav class="w-full border-b border-slate-800/60 bg-slate-900/80 backdrop-blur-md" role="navigation" aria-label="Site navigation">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center">
            <a href="index.html" class="font-black text-xl tracking-tighter text-white hover:text-indigo-400 transition-colors">
                TBS<span class="text-indigo-500">.</span>
            </a>
        </div>
    </nav>

    <!-- 404 Content -->
    <main class="flex-1 flex items-center justify-center px-4 relative overflow-hidden" id="main-content">

        <!-- Background glow -->
        <div class="absolute inset-0 pointer-events-none" aria-hidden="true">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] rounded-full bg-indigo-600/8 blur-[100px]"></div>
        </div>

        <div class="relative text-center max-w-lg mx-auto py-20">

            <!-- Floating 404 -->
            <div class="float mb-8 select-none" aria-hidden="true">
                <span class="text-[9rem] sm:text-[12rem] font-black leading-none gradient-text opacity-80">404</span>
            </div>

            <h1 class="text-2xl sm:text-3xl font-bold text-white mb-4">
                Page Not Found
            </h1>
            <p class="text-slate-400 text-base mb-10 leading-relaxed">
                The page you're looking for doesn't exist or may have been moved.<br>
                Let's get you back on track.
            </p>

            <div class="flex flex-wrap justify-center gap-4">
                <a href="index.html"
                   class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-7 py-3.5 rounded-full shadow-lg shadow-indigo-600/20 transition-all duration-200 hover:scale-105">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    Back to Home
                </a>
                <a href="index.html#contact"
                   class="inline-flex items-center gap-2 border border-slate-600 hover:border-indigo-500 hover:text-indigo-400 text-slate-300 font-semibold px-7 py-3.5 rounded-full transition-all duration-200 hover:scale-105">
                    Contact Me
                </a>
            </div>

            <!-- Quick nav links -->
            <div class="mt-14 border-t border-slate-800 pt-10">
                <p class="text-slate-500 text-xs uppercase tracking-widest font-semibold mb-5">Or jump to a section</p>
                <nav class="flex flex-wrap justify-center gap-x-6 gap-y-3 text-sm" aria-label="Quick navigation">
                    <a href="index.html#about"      class="text-slate-400 hover:text-indigo-400 transition-colors">About</a>
                    <a href="index.html#experience" class="text-slate-400 hover:text-indigo-400 transition-colors">Experience</a>
                    <a href="index.html#education"  class="text-slate-400 hover:text-indigo-400 transition-colors">Education</a>
                    <a href="index.html#skills"     class="text-slate-400 hover:text-indigo-400 transition-colors">Skills</a>
                    <a href="assets/Thom Simbeye's Resume.pdf" target="_blank" rel="noopener noreferrer" class="text-slate-400 hover:text-indigo-400 transition-colors">Resume ↗</a>
                </nav>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/60 py-6 px-4 text-center" role="contentinfo">
        <p class="text-slate-600 text-xs">
            &copy; <span id="year"></span> Thom Bertrum Simbeye &mdash; Lusaka, Zambia
        </p>
    </footer>

    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
